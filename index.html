<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Cap Mining</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#061108,#0a1c0e);
color:#fff;
min-height:100vh
}

.app{
max-width:480px;
margin:auto;
padding:18px 16px 100px
}

.top{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:20px
}

.brand{
display:flex;
align-items:center;
gap:10px
}

.logo{
width:45px;
height:45px;
border-radius:14px;
background:#13c237;
display:flex;
align-items:center;
justify-content:center;
font-size:23px;
font-weight:bold;
color:#061108;
box-shadow:0 0 20px #13c23766
}

.brand h2{
font-size:18px;
margin:0
}

.brand span{
font-size:11px;
color:#829886
}

.avatar{
width:42px;
height:42px;
border-radius:50%;
background:#17351e;
display:flex;
align-items:center;
justify-content:center;
font-size:20px
}

.hero{
background:linear-gradient(145deg,#102a16,#0b1d10);
border:1px solid #1d4827;
border-radius:24px;
padding:22px;
box-shadow:0 15px 40px #0005;
position:relative;
overflow:hidden
}

.hero:after{

position:absolute;

height:150px;
right:-70px;
top:-70px;
background:#13c237;
opacity:.08;
border-radius:50%
}

.small{
color:#829886;
font-size:13px
}

.balance{
font-size:38px;
font-weight:800;
margin:7px 0;
color:#39ed65
}

.coin{
font-size:12px;
color:#829886
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:18px
}

.stat{
background:#08160c;
border:1px solid #183c21;
border-radius:14px;
padding:13px
}

.stat b{
display:block;
font-size:17px;
margin-top:5px
}

.mining{
margin-top:15px;
background:#0e2514;
border:1px solid #1b4425;
border-radius:20px;
padding:20px
}

.mining-title{
display:flex;
justify-content:space-between;
align-items:center
}

.mining-title h3{
margin:0;
font-size:18px
}

.live{
color:#36e963;
font-size:12px
}

.circle{
width:125px;
height:125px;
margin:20px auto;
border-radius:50%;
border:8px solid #17351e;
border-top-color:#20d84c;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
box-shadow:0 0 25px #13c23722
}

.circle strong{
font-size:23px
}

.circle span{
font-size:11px;
color:#829886
}

.minebtn{
width:100%;
padding:15px;
border:0;
border-radius:14px;
background:#13c237;
color:#061108;
font-size:16px;
font-weight:800;
cursor:pointer;
box-shadow:0 8px 20px #13c23733
}

.minebtn.stop{
background:#e84b4b;
color:#fff
}

.menu{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
margin-top:15px
}

.menu button{
background:#0d2113;
border:1px solid #1b4024;
border-radius:14px;
color:#fff;
padding:12px 4px;
font-size:11px
}

.menu button div{
font-size:20px;
margin-bottom:5px
}

.page{
display:none
}

.page.active{
display:block
}

.card{
background:#0d2114;
border:1px solid #1b4024;
border-radius:20px;
padding:20px;
margin-top:15px
}

.card h2{
margin-top:0
}

input{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #285635;
background:#07130b;
color:#fff;
margin:7px 0;
outline:none
}
