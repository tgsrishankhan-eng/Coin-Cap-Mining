<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Coin Cap Mining</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#060812;color:#fff;
 font-family:Arial,sans-serif;
}
.app{max-width:520px;margin:auto;padding:15px 14px 95px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.brand{display:flex;align-items:center;gap:10px}
.logo{
 width:44px;height:44px;border-radius:15px;
 display:grid;place-items:center;font-size:22px;font-weight:bold;
 background:linear-gradient(135deg,#38e7ff,#4d8dff,#9a65ff);
 box-shadow:0 0 25px #4d8dff66
}
.brand b{display:block;font-size:15px;letter-spacing:1px}
.brand small{color:#8994b7;font-size:9px;letter-spacing:2px}
.avatar{
 width:42px;height:42px;border-radius:50%;
 display:grid;place-items:center;font-weight:bold;
 background:#121a30;border:1px solid #33416a
}
.hero{
 padding:20px;border-radius:25px;
 background:linear-gradient(145deg,#14234b,#11152a,#211644);
 border:1px solid #2b3a67;
 box-shadow:0 20px 50px #0008
}
.label{font-size:10px;color:#96a2c6;letter-spacing:2px}
.balance{font-size:38px;font-weight:900;margin:5px 0 16px}
.ccm{font-size:12px;color:#38e7ff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{
 padding:10px;border-radius:14px;
 background:#070b18aa;border:1px solid #2a3659
}
.stat small{display:block;color:#8994b7;font-size:9px}
.stat b{font-size:14px}
.page{display:none}
.page.active{display:block}
.section{margin-top:18px}
.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.title h2{font-size:17px;margin:0}
.title span{font-size:10px;color:#8994b7}

.mine{
 padding:18px;text-align:center;border-radius:24px;
 background:#0d1222;border:1px solid #293761
}
.ring{
 width:164px;height:164px;padding:7px;margin:2px auto 15px;
 border-radius:50%;
 background:conic-gradient(#38e7ff,#4d8dff,#9a65ff,#273050);
 box-shadow:0 0 38px #4d8dff35
}
.r
