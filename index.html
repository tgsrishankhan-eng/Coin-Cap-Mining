<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coin Cap Mining</title>

<style>
body{
margin:0;
background:#07130b;
color:white;
font-family:Arial;
text-align:center;
}
.box{
max-width:450px;
margin:auto;
padding:25px 15px;
}
.logo{
width:80px;
height:80px;
margin:auto;
border-radius:50%;
background:#13c237;
color:#07130b;
display:flex;
align-items:center;
justify-content:center;
font-size:38px;
font-weight:bold;
}
.card{
background:#0d2114;
border:1px solid #21472a;
border-radius:18px;
padding:20px;
margin-top:18px;
}
.balance{
font-size:35px;
color:#31e65d;
font-weight:bold;
margin:15px;
}
button{
width:100%;
padding:15px;
margin-top:12px;
border:0;
border-radius:12px;
background:#13c237;
font-size:17px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

<div class="logo">C</div>

<h1>COIN CAP MINING</h1>
<p>Mine • Earn • Grow</p>

<div class="card">

<p>Your Balance</p>

<div class="balance" id="balance">0.00</div>

<p>CCM Coins</p>

<button onclick="startMining()" id="btn">
START MINING
</button>

<p id="status">Mining Stopped</p>

</div>

<div class="card">

<button onclick="alert('Wallet coming soon')">
💰 WALLET
</button>

<button onclick="alert('Referral coming soon')">
👥 REFERRAL
</button>

<button onclick="alert('Profile coming soon')">
👤 PROFILE
</button>

</div>

</div>

<script>

let balance=0;
let mining=false;
let timer;

function startMining(){

if(mining){

mining=false;
clearInterval(timer);

document.getElementById("btn").innerText="START MINING";
document.getElementById("status").innerText="Mining Stopped";

}else{

mining=true;

document.getElementById("btn").innerText="STOP MINING";
document.getElementById("status").innerText="⛏ Mining Active";

timer=setInterval(function(){

balance += 12.5/3600;

document.getElementById("balance").innerText=
balance.toFixed(2);

},1000);

}

}

</script>

</body>
</html>
