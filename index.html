<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coin Cap Mining</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #07130b;
      color: white;
      min-height: 100vh;
    }

    .app {
      max-width: 480px;
      margin: auto;
      padding: 18px;
      padding-bottom: 90px;
    }

    .header {
      text-align: center;
      padding: 15px 0 25px;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: auto;
      border-radius: 50%;
      background: #13c237;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      font-weight: bold;
      color: #07130b;
      box-shadow: 0 0 25px rgba(19,194,55,.5);
    }

    h1 {
      margin-top: 12px;
      font-size: 25px;
    }

    .sub {
      color: #8fa895;
      margin-top: 5px;
      font-size: 14px;
    }

    .card {
      background: #0d2114;
      border: 1px solid #183b22;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .balance-title {
      color: #8fa895;
      font-size: 14px;
    }

    .balance {
      font-size: 34px;
      font-weight: bold;
      color: #31e65d;
      margin: 8px 0;
    }

    .coin {
      font-size: 14px;
      color: #9db5a3;
    }

    .mining-box {
      text-align: center;
    }

    .status {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .rate {
      color: #8fa895;
      margin-bottom: 18px;
    }

    .mine-btn {
      width: 100%;
      border: none;
      padding: 16px;
      border-radius: 14px;
      background: #13c237;
      color: #061008;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .mine-btn.stop {
      background: #e64b4b;
      color: white;
    }

    .progress {
      height: 8px;
      background: #18301f;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 18px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #13c237;
      transition: width .3s;
    }

    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .menu button {
      padding: 16px 10px;
      border: 1px solid #21472a;
      background: #102719;
      color: white;
      border-radius: 14px;
      font-size: 15px;
      cursor: pointer;
    }
